<!DOCTYPE html>
<html>
<head>
<title>Estruturas de Controle</title>
<meta charset="UTF-8">
</head>
<script>
    let x = prompt("Digite um número ");
    document.write("<h1>Estruturas de Controles</h1>");
    if (x > 5) {
        document.write("O valore de x é maior que cinco. <br>");
    }
    else if (x < 5) {
        document.write("O valore de x é menor que cinco. <br>");
    }
    else {
        document.write("O valor de x é igual a cinco. <br>");
    }
    </script>
</html>
