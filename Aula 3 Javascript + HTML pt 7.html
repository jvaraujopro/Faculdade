<!DOCTYPE html>
<html>
<head>
<title>Estruturas de Controle</title>
<meta charset="UTF-8">
</head>
<script>
    let a = parseInt(prompt("Entre com o primeiro lado do triângulo:"));
        b = parseInt(prompt("Entre com o segundo lado do triângulo"));
        c = parseInt(prompt ("Entre com o treceiro lado do triângulo"));
document.write("<h1>Estuturas de Controle<h1>");
    if (a + b > c && a + c > b && b + c > a) {
        document.write("São lados válidos para um triângulo!");
    }
    else {
        document.write("São lados inválidos para um triângulo!");
    }
</script>
</html>
